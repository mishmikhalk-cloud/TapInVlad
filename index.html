<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Тапалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 0%,#2b3a67 0%,#11152b 55%,#070912 100%);
    color:#fff;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:24px;padding:20px;user-select:none;
    touch-action:manipulation;min-height:100dvh;
  }
  
  /* Обертка для счёта и дохода в час */
  .score-container {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 15px;
    margin-bottom: 5px;
  }

  .score{
    font-size:64px;font-weight:900;color:#FFE14D;
    text-shadow:0 0 30px rgba(255,225,77,.6);
    line-height:1;transition:transform .1s;text-align:center;
  }
  .score.bump{transform:scale(1.15);}

  .per-hour {
    font-size: 16px;
    color: #4ade80;
    font-weight: 700;
    background: rgba(74, 222, 128, 0.1);
    padding: 6px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
    border: 1px solid rgba(74, 222, 128, 0.3);
    white-space: nowrap;
  }

  .label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
         opacity:.5;margin-top:6px;text-align:center;}
         
  .stage{position:relative;display:flex;justify-content:center;}
  .target{
    width:min(70vw,280px);cursor:pointer;
    filter:drop-shadow(0 12px 40px rgba(255,225,77,.4));
    transition:filter .2s;will-change:transform;
  }
  .target:hover{filter:drop-shadow(0 12px 55px rgba(255,225,77,.7));}
  .target img,.target svg{display:block;width:100%;height:auto;
                          pointer-events:none;border-radius:20px;}
  .target.pop{animation:pop .12s ease;}
  @keyframes pop{50%{transform:scale(.93);}}
  .glow{
    position:absolute;inset:-15%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle,rgba(255,225,77,.3),transparent 65%);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.12);opacity:.6;}}
  .particle{
    position:absolute;border-radius:50%;pointer-events:none;
    animation:burst .7s ease-out forwards;
  }
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
  .floater{
    position:absolute;pointer-events:none;transform:translate(-50%,-50%);
    font-weight:900;font-size:26px;color:#fff;
    text-shadow:0 0 12px #FFE14D,0 0 26px #FFE14D;
    animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{to{transform:translate(-50%,-160%) scale(1.4);opacity:0;}}
  .hint{font-size:12px;opacity:.35;text-align:center;}
</style>
</head>
<body>

  <div>
    <div class="score-container">
      <div class="score" id="score">0</div>
      <div class="per-hour">⚡ <span id="perHour">100</span> в час</div>
    </div>
    <div class="label">Тапни по картинке</div>
  </div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="target" id="target">
     <img src="photo_5470128648531681464_m.jpg" alt="Влад">
    </div>
  </div>

  <div class="hint">Прогресс сохраняется автоматически</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor?.('#11152b');
  tg.setBackgroundColor?.('#11152b');
  try { tg.disableVerticalSwipes?.(); } catch(e){}
}

const $ = id => document.getElementById(id);
const els = { 
  score:$('score'), 
  stage:$('stage'), 
  target:$('target'),
  perHour:$('perHour')
};

const STORAGE_KEY = 'tap-score-v2'; // Поменял версию ключа, так как изменилась логика сохранения
// score теперь хранит дробное значение, чтобы пассивный доход был точным
let state = { score: 0.0, perClick: 1 };

// Настройка пассивного дохода: 100 монет в час
const PER_HOUR = 100;
const PER_SECOND = PER_HOUR / 3600; // ~0.02777 монет в секунду
els.perHour.textContent = PER_HOUR;

let lastTick = Date.now();

function loadScore() {
  const onLoad = (dataStr) => {
    if (dataStr) {
      try {
        const parsed = JSON.parse(dataStr);
        // Обязательно приводим к числу, так как могли сохраниться строки
        state.score = parseFloat(parsed.score) || 0;
        state.perClick = parseInt(parsed.perClick) || 1;
      } catch(e){}
    }
    render();
    lastTick = Date.now();
  };

  if (tg?.CloudStorage) {
    tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
      if (!err && value) {
        onLoad(value);
      } else {
        onLoad(localStorage.getItem(STORAGE_KEY));
      }
    });
  } else {
    onLoad(localStorage.getItem(STORAGE_KEY));
  }
}

let saveTimer = null;
function saveScore() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const data = JSON.stringify(state);
    if (tg?.CloudStorage) tg.CloudStorage.setItem(STORAGE_KEY, data, () => {});
    try { localStorage.setItem(STORAGE_KEY, data); } catch(e){}
  }, 400);
}

// Функция отображения: floor нужен, чтобы на экране были целые числа, пока копятся дробные
const fmt = n => Math.floor(n).toLocaleString('ru-RU');
function render(bump = false) {
  els.score.textContent = fmt(state.score);
  if (bump) {
    els.score.classList.remove('bump');
    void els.score.offsetWidth;
    els.score.classList.add('bump');
  }
}

// --- ПАССИВНЫЙ ДОХОД ---
// Запускаем цикл каждые 100 мс, чтобы счёт рос плавно
setInterval(() => {
  const now = Date.now();
  const delta = (now - lastTick) / 1000; // сколько секунд прошло
  lastTick = now;
  
  if (delta > 0) {
    state.score += PER_SECOND * delta;
    render(); // Обновляем текст на экране (без анимации прыжка)
  }
}, 100);

// --- ЗВУК ---
let audioCtx = null;
function playSound() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(680, t);
    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.06);
    gain.gain.setValueAtTime(0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.13);
  } catch(e){}
}

const COLORS = ['#FFE14D','#FFD400','#00e5ff','#7cffb2','#ff6b9d'];

function spawnParticles(x, y) {
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    const a = Math.random() * Math.PI * 2;
    const d = 50 + Math.random() * 80;
    const s = 6 + Math.random() * 10;
    p.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px;` +
      `background:${COLORS[(Math.random()*COLORS.length)|0]};` +
      `--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;`;
    p.addEventListener('animationend', () => p.remove());
    els.stage.appendChild(p);
  }
}

function spawnFloater(x, y) {
  const f = document.createElement('div');
  f.className = 'floater';
  f.textContent = '+' + state.perClick;
  f.style.left = x + 'px';
  f.style.top  = y + 'px';
  f.addEventListener('animationend', () => f.remove());
  els.stage.appendChild(f);
}

function doClick(x, y) {
  state.score += state.perClick; // +1 за тап
  render(true);
  spawnParticles(x, y);
  spawnFloater(x, y);
  playSound();
  tg?.HapticFeedback?.impactOccurred?.('light');
  els.target.classList.remove('pop');
  void els.target.offsetWidth;
  els.target.classList.add('pop');
  saveScore();
}

els.target.addEventListener('pointerdown', e => {
  const r = els.stage.getBoundingClientRect();
  doClick(e.clientX - r.left, e.clientY - r.top);
});

loadScore();

// Сохраняем при закрытии
window.addEventListener('beforeunload', saveScore);
</script>
</body>
</html>
