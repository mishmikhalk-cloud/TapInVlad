<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Тапалка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Подключаем Supabase (база данных) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    background:radial-gradient(circle at 50% 0%,#2b3a67 0%,#11152b 55%,#070912 100%);
    color:#fff;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:15px;padding:20px;user-select:none;
    touch-action:manipulation;min-height:100dvh;
  }
  
  /* Панель профиля */
  .profile-header {
    display: flex; flex-direction: column; align-items: center;
    width: 100%; max-width: 300px; background: rgba(255, 255, 255, 0.05);
    padding: 12px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
    margin-bottom: 5px;
  }
  .level-info {
    display: flex; justify-content: space-between; width: 100%;
    font-size: 14px; font-weight: bold; color: #FFE14D; margin-bottom: 8px;
  }
  .xp-bar-bg {
    width: 100%; height: 8px; background: #2b3a67; border-radius: 10px; overflow: hidden;
  }
  .xp-bar-fill {
    height: 100%; width: 0%; background: linear-gradient(90deg, #FFE14D, #ff9500);
    border-radius: 10px; transition: width 0.3s ease;
  }

  .score{
    font-size:48px;font-weight:900;color:#FFE14D;
    text-shadow:0 0 30px rgba(255,225,77,.6);
    line-height:1;transition:transform .1s;text-align:center;
  }
  .score.bump{transform:scale(1.15);}
  
  .label{font-size:12px;letter-spacing:.2em;text-transform:uppercase;
         opacity:.5;margin-top:6px;text-align:center;}
         
  .stage{position:relative;display:flex;justify-content:center;}
  
  .target{
    width:min(55vw,220px);cursor:pointer;
    filter:drop-shadow(0 12px 40px rgba(255,225,77,.4));
    transition:filter .2s;will-change:transform;
    touch-action: manipulation; -webkit-user-select: none; user-select: none;
  }
  @media (hover: hover) { .target:hover{filter:drop-shadow(0 12px 55px rgba(255,225,77,.7));} }
  
  .target img{
    display:block;width:100%;height:100%;object-fit:cover;
    aspect-ratio: 1 / 1; pointer-events:none; border-radius:20px; transition: opacity 0.2s;
  }
  .target.pop{animation:pop .12s ease;}
  @keyframes pop{50%{transform:scale(.93);}}
  
  .glow{
    position:absolute;inset:-15%;z-index:-1;pointer-events:none;
    background:radial-gradient(circle,rgba(255,225,77,.3),transparent 65%);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{50%{transform:scale(1.12);opacity:.6;}}
  
  .particle{ position:absolute;border-radius:50%;pointer-events:none; animation:burst .7s ease-out forwards; }
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
  
  .floater{
    position:absolute;pointer-events:none;transform:translate(-50%,-50%);
    font-weight:900;font-size:24px;color:#fff; text-shadow:0 0 12px #FFE14D,0 0 26px #FFE14D;
    animation:floatUp .9s ease-out forwards;
  }
  @keyframes floatUp{to{transform:translate(-50%,-160%) scale(1.4);opacity:0;}}
  
  /* Блок с кнопками снизу */
  .bottom-area {
    display: flex; flex-direction: column; align-items: center; gap: 10px; margin-top: 5px;
  }
  .hint{font-size:12px;opacity:.35;text-align:center;}

  .btn-row {
    display: flex; gap: 10px;
  }

  #shopBtn, #topBtn {
    background: rgba(255, 225, 77, 0.15); border: 1px solid #FFE14D;
    color: #FFE14D; padding: 10px 20px; border-radius: 12px;
    font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
  }
  #shopBtn:active, #topBtn:active { transform: scale(0.95); }

  /* --- МОДАЛЬНЫЕ ОКНА --- */
  .modal {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 999; padding: 20px;
    flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(5px);
  }
  .modal-content {
    background: #11152b; border: 1px solid rgba(255, 225, 77, 0.3);
    padding: 20px; border-radius: 20px; width: 100%; max-width: 350px;
    max-height: 80vh; display: flex; flex-direction: column;
  }
  .modal h2 { color: #FFE14D; margin-bottom: 15px; text-align: center; }
  .close-btn { margin-top: 15px; text-align: center; color: #ff6b9d; cursor: pointer; font-weight: bold; padding: 10px;}
  
  .vlad-list { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 5px;}
  .vlad-list::-webkit-scrollbar { width: 6px; }
  .vlad-list::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
  .vlad-list::-webkit-scrollbar-thumb { background: #FFE14D; border-radius: 10px; }
  
  .vlad-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05); padding: 10px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .vlad-item img { width: 50px; height: 50px; border-radius: 10px; object-fit: cover; }
  .vlad-info { flex: 1; margin-left: 10px; }
  .vlad-info h3 { margin: 0 0 5px 0; font-size: 14px; }
  .vlad-info p { margin: 0; font-size: 12px; color: #aaa; }
  
  .vlad-btn {
    background: #FFE14D; color: #000; border: none; padding: 8px 12px;
    border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 13px;
  }
  .vlad-btn.active { background: #4ade80; }
  .vlad-btn:disabled { background: #555; color: #888; cursor: not-allowed; }

  /* --- СПИСОК ЛИДЕРОВ --- */
  #leaderboardList { list-style: none; padding: 0; margin: 0; overflow-y: auto; }
  #leaderboardList li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; margin-bottom: 8px; border-radius: 12px;
    background: rgba(255,255,255,0.05); font-size: 15px;
  }
  #leaderboardList li:nth-child(1) { background: rgba(255, 215, 0, 0.2); border: 1px solid #FFD700; }
  #leaderboardList li:nth-child(2) { background: rgba(192, 192, 192, 0.15); border: 1px solid #C0C0C0; }
  #leaderboardList li:nth-child(3) { background: rgba(205, 127, 50, 0.15); border: 1px solid #CD7F32; }
  
  .rank { font-weight: 900; width: 30px; text-align: center; }
  .player-name { flex: 1; margin-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player-score { font-weight: 900; color: #FFE14D; }
</style>
</head>
<body>

  <div class="profile-header">
    <div class="level-info">
      <span>Уровень: <span id="levelDisplay">0</span></span>
      <span><span id="xpDisplay">0</span> / <span id="xpNeeded">100</span> XP</span>
    </div>
    <div class="xp-bar-bg"><div class="xp-bar-fill" id="xpBar"></div></div>
  </div>

  <div>
    <div class="score" id="score">0</div>
    <div class="label" id="clickLabel">Тапни по картинке (+1)</div>
  </div>

  <div class="stage" id="stage">
    <div class="glow"></div>
    <div class="target" id="target">
     <img id="mainImage" src="VladGopnik.jpg" alt="Влад">
    </div>
  </div>

  <div class="bottom-area">
    <div class="hint">Прогресс сохраняется автоматически</div>
    <div class="btn-row">
      <button id="shopBtn" onclick="openShop()">🛒 Магазин</button>
      <button id="topBtn" onclick="openLeaderboard()">🏆 Топ</button>
    </div>
  </div>

  <!-- МАГАЗИН -->
  <div id="shopModal" class="modal">
    <div class="modal-content">
      <h2>Выбери скин</h2>
      <div class="vlad-list" id="vladList"></div>
      <div class="close-btn" onclick="closeShop()">Закрыть</div>
    </div>
  </div>

  <!-- ТОП ИГРОКОВ -->
  <div id="leaderboardModal" class="modal">
    <div class="modal-content">
      <h2>🏆 Топ 10 игроков</h2>
      <ul id="leaderboardList">
        <li style="justify-content:center;">Загрузка...</li>
      </ul>
      <div class="close-btn" onclick="closeLeaderboard()">Закрыть</div>
    </div>
  </div>

<script>
// ==========================================
// ВСТАВЬ СВОИ КЛЮЧИ SUPABASE ЗДЕСЬ
// ==========================================
const SUPABASE_URL = 'https://wdffazkzmtamseqsxxhg.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_6c6Cpbyfpp0-w37fpKDQyQ_do90RWeJ'; 
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==========================================
// TELEGRAM
// ==========================================
const tg = window.Telegram?.WebApp;
let user = null;
if (tg) {
  tg.ready(); tg.expand();
  tg.setHeaderColor?.('#11152b'); tg.setBackgroundColor?.('#11152b');
  try { tg.disableVerticalSwipes?.(); } catch(e){}
  user = tg.initDataUnsafe?.user;
}

const $ = id => document.getElementById(id);
const els = { 
  score:$('score'), stage:$('stage'), target:$('target'), mainImage:$('mainImage'), clickLabel:$('clickLabel'),
  levelDisplay:$('levelDisplay'), xpDisplay:$('xpDisplay'), xpNeeded:$('xpNeeded'), xpBar:$('xpBar')
};

const STORAGE_KEY = 'tap-score-v11'; 
let state = { 
  score: 0, 
  unlocked: ['1'], 
  current: '1',
  level: 0,
  xp: 0,
  timePlayed: 0 
};

const dbId = user ? user.id.toString() : 'test_user';
const dbUsername = user && user.username ? user.username : '';
const dbFirstName = user ? (user.first_name || 'Игрок') : 'Тестер';

const XP_PER_CLICK = 1;       
const XP_PER_MINUTE = 5;      
const XP_PER_BUY = 500;       

function getXpNeeded(level) {
  return Math.floor(100 * Math.pow(1.2, level)); 
}

// ==========================================
// СПИСОК СКИНОВ
// ==========================================
const VLADS = [
  { id: '1', name: 'Влад дрипчик', price: 0, multiplier: 1, src: 'VladGopnik.jpg' },
  { id: '2', name: 'Арсэн Дрип', price: 25000, multiplier: 2, src: 'arsen.jpg' },
  { id: '3', name: 'Веринский прайм', price: 40000, multiplier: 4, src: 'verinskiPrime.jpg' },
  { id: '4', name: 'Никита', price: 60000, multiplier: 5, src: 'hikiya.jpg' },
  { id: '5', name: 'Костя', price: 80000, multiplier: 10, src: 'kokosik.png' }
];
// ==========================================

function loadScore() {
  const onLoad = (dataStr) => {
    if (dataStr) {
      try {
        const parsed = JSON.parse(dataStr);
        state = { ...state, ...parsed }; 
        if (typeof state.xp === 'undefined') state.xp = 0;
        if (typeof state.level === 'undefined') state.level = 0;
        if (typeof state.timePlayed === 'undefined') state.timePlayed = 0;
      } catch(e){}
    }
    applyVlad(state.current);
    updateLevelUI();
    render();
    
    // После загрузки локальных данных синхронизируемся с базой
    syncWithDB(); 
  };

  if (tg?.CloudStorage) {
    tg.CloudStorage.getItem(STORAGE_KEY, (err, value) => {
      if (!err && value) onLoad(value);
      else onLoad(localStorage.getItem(STORAGE_KEY));
    });
  } else {
    onLoad(localStorage.getItem(STORAGE_KEY));
  }
}

let saveTimer = null;
function saveScore() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    // Сохраняем локально
    const data = JSON.stringify(state);
    if (tg?.CloudStorage) tg.CloudStorage.setItem(STORAGE_KEY, data, () => {});
    try { localStorage.setItem(STORAGE_KEY, data); } catch(e){}

    // Отправляем в базу данных
    supabaseClient.from('players').upsert({
      id: dbId, 
      username: dbUsername, 
      first_name: dbFirstName,
      score: state.score, 
      last_active: new Date().toISOString()
    }).then(({error}) => {
      if (error) console.warn('Ошибка сохранения в БД:', error);
    });
  }, 1000);
}

// Синхронизация при старте (чтобы подтянуть очки из базы, если играли с другого устройства)
async function syncWithDB() {
  try {
    const { data, error } = await supabaseClient.from('players').select('*').eq('id', dbId).single();
    if (data) {
      // Если в базе очков больше, чем локально - берем их
      if (data.score > state.score) {
        state.score = data.score;
        render();
      }
      // Обновляем инфу на случай если ник изменился
      await supabaseClient.from('players').upsert({
        id: dbId, username: dbUsername, first_name: dbFirstName,
        score: state.score, last_active: new Date().toISOString()
      });
    } else if (!error || error.code === 'PGRST116') {
      // Если игрока нет, создаем его
      await supabaseClient.from('players').insert([{ 
        id: dbId, username: dbUsername, first_name: dbFirstName, score: state.score 
      }]);
    }
  } catch(e) { console.warn('БД недоступна'); }
}

const fmt = n => n.toLocaleString('ru-RU');
function render(bump = false) {
  els.score.textContent = fmt(state.score);
  if (bump) {
    els.score.classList.remove('bump');
    void els.score.offsetWidth;
    els.score.classList.add('bump');
  }
}

// ==========================================
// СИСТЕМА УРОВНЕЙ
// ==========================================
function addXP(amount) {
  state.xp += amount;
  let needed = getXpNeeded(state.level);
  let leveledUp = false;

  while (state.xp >= needed) {
    state.xp -= needed;
    state.level++;
    leveledUp = true;
    needed = getXpNeeded(state.level);
  }

  if (leveledUp) {
    tg?.HapticFeedback?.notificationOccurred?.('success');
    if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    updateClickLabel(); 
  }

  updateLevelUI();
  saveScore();
}

function updateLevelUI() {
  els.levelDisplay.textContent = state.level;
  const needed = getXpNeeded(state.level);
  els.xpDisplay.textContent = Math.floor(state.xp);
  els.xpNeeded.textContent = needed;
  
  const percent = Math.min(100, (state.xp / needed) * 100);
  els.xpBar.style.width = percent + '%';
}

setInterval(() => {
  state.timePlayed += 1; 
  if (state.timePlayed % 60 === 0) {
    addXP(XP_PER_MINUTE);
  }
}, 1000);

// ==========================================
// МАГАЗИН
// ==========================================
function openShop() { $('shopModal').style.display = 'flex'; renderShop(); }
function closeShop() { $('shopModal').style.display = 'none'; }

function renderShop() {
  const list = $('vladList');
  list.innerHTML = '';

  VLADS.forEach(vlad => {
    const isBought = state.unlocked.includes(vlad.id);
    const isActive = state.current === vlad.id;
    const canBuy = state.score >= vlad.price;

    const div = document.createElement('div');
    div.className = 'vlad-item';
    div.innerHTML = `
      <img src="${vlad.src}">
      <div class="vlad-info">
        <h3>${vlad.name} (x${vlad.multiplier})</h3>
        <p>${isBought ? 'Куплено' : 'Цена: ' + fmt(vlad.price)}</p>
      </div>
      <button class="vlad-btn ${isActive ? 'active' : ''}" 
              onclick="handleVlad('${vlad.id}')"
              ${!isBought && !canBuy ? 'disabled' : ''}>
        ${isActive ? 'Выбран' : (isBought ? 'Выбрать' : 'Купить')}
      </button>
    `;
    list.appendChild(div);
  });
}

function handleVlad(id) {
  const vlad = VLADS.find(v => v.id === id);
  if (!vlad) return;

  const isBought = state.unlocked.includes(id);

  if (isBought) {
    state.current = id;
    applyVlad(id);
  } else {
    if (state.score >= vlad.price) {
      state.score -= vlad.price;
      state.unlocked.push(id);
      state.current = id;
      applyVlad(id);
      render();
      addXP(XP_PER_BUY);
      tg?.HapticFeedback?.notificationOccurred?.('success');
    } else {
      tg?.HapticFeedback?.notificationOccurred?.('error');
      return;
    }
  }
  
  saveScore();
  renderShop(); 
}

function applyVlad(id) {
  const vlad = VLADS.find(v => v.id === id) || VLADS[0];
  els.mainImage.src = vlad.src; 
  updateClickLabel();
}

function updateClickLabel() {
  const vlad = VLADS.find(v => v.id === state.current) || VLADS[0];
  const totalClickPower = vlad.multiplier + state.level;
  els.clickLabel.textContent = `Тапни по картинке (+${totalClickPower})`;
}

// ==========================================
// ТАБЛИЦА ЛИДЕРОВ
// ==========================================
function openLeaderboard() {
  $('leaderboardModal').style.display = 'flex';
  loadLeaderboard();
}
function closeLeaderboard() {
  $('leaderboardModal').style.display = 'none';
}

async function loadLeaderboard() {
  const list = $('leaderboardList');
  list.innerHTML = '<li style="justify-content:center;">Загрузка...</li>';

  try {
    // Запрашиваем топ-10, сортируя по убыванию очков
    const { data, error } = await supabaseClient
      .from('players')
      .select('*')
      .order('score', { ascending: false })
      .limit(10);

    if (error) throw error;
    
    if (!data || data.length === 0) { 
      list.innerHTML = '<li style="justify-content:center;">Пока никто не играл</li>'; 
      return; 
    }

    list.innerHTML = '';
    data.forEach((player, index) => {
      const li = document.createElement('li');
      let rankText = index + 1;
      if (index === 0) rankText = '🥇'; 
      if (index === 1) rankText = '🥈'; 
      if (index === 2) rankText = '🥉';
      
      const displayName = player.username ? `@${player.username}` : (player.first_name || 'Игрок');
      
      li.innerHTML = `
        <span class="rank">${rankText}</span>
        <span class="player-name">${displayName}</span>
        <span class="player-score">${fmt(player.score)}</span>
      `;
      list.appendChild(li);
    });
  } catch(e) {
    console.error(e);
    list.innerHTML = '<li style="justify-content:center; color:#ff6b9d;">Ошибка загрузки</li>';
  }
}

// --- ИГРА ---
let audioCtx = null;
function initAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound() {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
    osc.type = 'triangle'; osc.frequency.setValueAtTime(680, t);
    osc.frequency.exponentialRampToValueAtTime(1200, t + 0.06);
    gain.gain.setValueAtTime(0.08, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.13);
  } catch(e){}
}

const COLORS = ['#FFE14D','#FFD400','#00e5ff','#7cffb2','#ff6b9d'];
function spawnParticles(x, y) {
  for (let i = 0; i < 10; i++) {
    const p = document.createElement('div'); p.className = 'particle';
    const a = Math.random() * Math.PI * 2; const d = 50 + Math.random() * 80; const s = 6 + Math.random() * 10;
    p.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px;background:${COLORS[(Math.random()*COLORS.length)|0]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;`;
    p.addEventListener('animationend', () => p.remove()); els.stage.appendChild(p);
  }
}
function spawnFloater(x, y, power) {
  const f = document.createElement('div'); f.className = 'floater';
  f.textContent = '+' + power; f.style.left = x + 'px'; f.style.top  = y + 'px';
  f.addEventListener('animationend', () => f.remove()); els.stage.appendChild(f);
}

function doClick(x, y) {
  const currentVlad = VLADS.find(v => v.id === state.current) || VLADS[0];
  const clickPower = currentVlad.multiplier + state.level;

  state.score += clickPower;
  render(true); 
  spawnParticles(x, y); 
  spawnFloater(x, y, clickPower); 
  playSound();
  
  addXP(XP_PER_CLICK); 

  tg?.HapticFeedback?.impactOccurred?.('light');
  els.target.classList.remove('pop'); void els.target.offsetWidth; els.target.classList.add('pop');
}

els.target.addEventListener('pointerdown', e => {
  e.preventDefault(); initAudio();        
  const r = els.stage.getBoundingClientRect();
  doClick(e.clientX - r.left, e.clientY - r.top);
}, { passive: false });

els.target.addEventListener('touchstart', e => {
  e.preventDefault(); initAudio();
  if (e.touches && e.touches.length > 0) {
    const touch = e.touches[0];
    const r = els.stage.getBoundingClientRect();
    doClick(touch.clientX - r.left, touch.clientY - r.top);
  }
}, { passive: false });

loadScore();
window.addEventListener('beforeunload', saveScore);
</script>
</body>
</html>
